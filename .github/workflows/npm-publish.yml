name: Publish Plugins to npm

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'publish.config.json'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to publish (leave empty to publish all changed)'
        required: false
        type: string
      force:
        description: 'Force publish even when no plugin files changed'
        required: false
        default: false
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_plugins: ${{ steps.detect.outputs.changed_plugins }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed plugins
        id: detect
        shell: bash
        run: |
          set -eo pipefail
          
          # Read publish.config.json to get plugin list
          PLUGINS=$(node -p "const c=require('./publish.config.json');Object.keys(c.plugins).join(',')")
          echo "Configured plugins: $PLUGINS"
          
          # Get base commit for this push
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT="${{ github.event.before }}"
          elif git rev-parse --verify HEAD^ &>/dev/null; then
            BASE_COMMIT=HEAD^
          else
            # First commit - use current commit as base (no changes detected)
            BASE_COMMIT=HEAD
          fi
          echo "Base commit: $BASE_COMMIT"
          
          # Get list of changed files since base
          CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD -- plugins/ 2>/dev/null || echo "")
          echo "Changed files: $CHANGED_FILES"
          
          # Find which plugins have changes
          CHANGED_PLUGINS=""
          for plugin in $(echo "$PLUGINS" | tr ',' ' '); do
            if echo "$CHANGED_FILES" | grep -q "plugins/$plugin/"; then
              if [ -z "$CHANGED_PLUGINS" ]; then
                CHANGED_PLUGINS="$plugin"
              else
                CHANGED_PLUGINS="$CHANGED_PLUGINS,$plugin"
              fi
            fi
          done
          
          # Check for manual trigger
          if [ -n "${{ github.event.inputs.plugin }}" ]; then
            MANUAL_PLUGINS="${{ github.event.inputs.plugin }}"
            CHANGED_PLUGINS=""
            for plugin in $(echo "$MANUAL_PLUGINS" | tr ',' ' '); do
              plugin=$(echo "$plugin" | xargs)
              if [ -z "$plugin" ]; then
                continue
              fi
              if [ -z "$CHANGED_PLUGINS" ]; then
                CHANGED_PLUGINS="$plugin"
              else
                CHANGED_PLUGINS="$CHANGED_PLUGINS,$plugin"
              fi
            done
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            CHANGED_PLUGINS="$PLUGINS"
            echo "Force publish enabled: publishing all configured plugins"
          fi
          
          if [ -z "$CHANGED_PLUGINS" ]; then
            echo "changed_plugins=none" >> $GITHUB_OUTPUT
            echo "No plugin changes detected"
          else
            echo "changed_plugins=$CHANGED_PLUGINS" >> $GITHUB_OUTPUT
            echo "Changed plugins: $CHANGED_PLUGINS"
          fi

  publish:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.changed_plugins != 'none'
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Type check
        run: bun run build

      - name: Publish each changed plugin
        run: |
          CHANGED="${{ needs.detect-changes.outputs.changed_plugins }}"
          
          echo "Publishing plugins: $CHANGED"
          
          for plugin in $(echo "$CHANGED" | tr ',' ' '); do
            echo "=== Publishing $plugin ==="
            
            PLUGIN_PATH=$(node -p "const config=require('./publish.config.json'); const plugin=config.plugins['$plugin']; if (!plugin) { throw new Error('Unknown plugin: $plugin'); } plugin.path")
            
            # Get current version
            CURRENT=$(node -p "require('./$PLUGIN_PATH/package.json').version")
            echo "Current version: $CURRENT"
            
            # Bump version
            NEW=$(node -p "const [major, minor, patch] = '$CURRENT'.split('.').map(Number); [major, minor, patch + 1].join('.')")
            echo "New version: $NEW"
            
            # Update package.json safely
            node -e "const fs=require('fs'); const path='./$PLUGIN_PATH/package.json'; const p=JSON.parse(fs.readFileSync(path,'utf8')); p.version='$NEW'; fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');"
            
            # Commit version bump
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add "$PLUGIN_PATH/package.json"
            git commit -m "chore: $plugin v$NEW" || exit 0
            git push
            
            # Create & push tag
            git tag "$plugin-v$NEW"
            git push origin "$plugin-v$NEW"
            
            # Publish to npm
            printf '//registry.npmjs.org/:_authToken=%s\n' "${{ secrets.NPM_TOKEN }}" > "$PLUGIN_PATH/.npmrc"
            npm --prefix "$PLUGIN_PATH" config set provenance true
            npm --prefix "$PLUGIN_PATH" publish --access public
            rm -f "$PLUGIN_PATH/.npmrc"
            
            echo "✅ Published $plugin v$NEW"
          done

  no-changes:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.changed_plugins == 'none'
    steps:
      - name: No changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "No plugins selected. Set 'plugin' or enable 'force' to publish manually."
          else
            echo "No plugin changes detected, skipping publish"
          fi